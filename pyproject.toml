[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-earthscope-pipeline"
version = "0.1.0"
description = "1 Hz GNSS earthquake download, PRIDE PPP-AR processing, and batch orchestration."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gnss-eq = "gnss_eq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
