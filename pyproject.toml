[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-earthscope-pipeline"
version = "0.1.0"
description = "1 Hz GNSS earthquake download, PRIDE PPP-AR processing, and batch orchestration."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.scripts]
gnss-eq = "gnss_eq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnss_eq = ["static/*"]
