<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GNSS 地震观测控制台</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/styles.css?v=maplibre3">
</head>
<body>
  <div class="grain"></div>
  <main class="shell">
    <aside class="command-rail panel">
      <div class="brand-block">
        <p class="eyebrow">EarthScope · PRIDE · 1 Hz</p>
        <h1>GNSS 地震观测控制台</h1>
        <p class="lede">从本地数据库检索地震事件、查看可用 GNSS 站点，并在网页端预览或启动处理工作流。</p>
      </div>

      <section class="card">
        <div class="section-title">
          <span>01</span>
          <h2>查询地震</h2>
        </div>
        <label>区域 / 地点 / Event ID
          <input id="search-q" type="search" placeholder="California / Alaska / Japan / ci38457511">
        </label>
        <div class="grid-two">
          <label>最小震级
            <input id="min-mag" type="number" min="0" step="0.1" value="6">
          </label>
          <label>结果数
            <input id="limit" type="number" min="1" max="500" value="100">
          </label>
        </div>
        <div class="grid-two">
          <label>开始日期
            <input id="start-date" type="date">
          </label>
          <label>结束日期
            <input id="end-date" type="date">
          </label>
        </div>
        <label class="check-row">
          <input id="has-existing" type="checkbox">
          <span>只看本地已有数据</span>
        </label>
        <button id="search-btn" class="primary">扫描数据库</button>
      </section>

      <section class="card">
        <div class="section-title">
          <span>02</span>
          <h2>运行设置</h2>
        </div>
        <label>Base URL
          <input id="base-url" type="url" placeholder="https://web-services.unavco.org">
        </label>
        <label>API Key / Token
          <input id="api-key" type="password" placeholder="仅当前浏览器会话使用">
        </label>
        <div class="grid-two">
          <label>半径 km
            <input id="radius-km" type="number" min="1" max="1000" value="200">
          </label>
          <label>最大站点
            <input id="max-stations" type="number" min="1" max="200" value="20">
          </label>
        </div>
        <label>Timeout 秒
          <input id="timeout" type="number" min="60" max="86400" value="3600">
        </label>
        <label class="check-row">
          <input id="include-existing" type="checkbox">
          <span>即使已有数据也允许预览 / 运行</span>
        </label>
      </section>
    </aside>

    <section class="map-stage panel">
      <div class="map-header">
        <div>
          <p class="eyebrow">Interactive world map</p>
          <h2>地震与 GNSS 站点分布</h2>
        </div>
        <div id="health-pill" class="pill muted">连接中</div>
      </div>
      <div id="map"></div>
      <div class="results-strip">
        <div class="strip-title">检索结果 <span id="result-count">0</span></div>
        <div id="event-list" class="event-list"></div>
      </div>
    </section>

    <aside class="detail-drawer panel">
      <section class="card selected-card">
        <p class="eyebrow">Selected event</p>
        <h2 id="selected-title">尚未选择事件</h2>
        <div id="selected-meta" class="meta-grid"></div>
        <div id="existing-badge" class="status-badge muted">等待查询</div>
      </section>

      <section class="card">
        <div class="section-title">
          <span>03</span>
          <h2>工作流预览</h2>
        </div>
        <button id="preview-btn" class="secondary" disabled>预览工作流</button>
        <button id="run-btn" class="danger" disabled>启动工作流</button>
        <pre id="preview-box" class="console">请选择一个事件，然后点击预览。</pre>
      </section>

      <section class="card job-card">
        <div class="section-title">
          <span>04</span>
          <h2>运行记录</h2>
        </div>
        <div id="jobs-list" class="jobs-list"></div>
        <pre id="log-box" class="console small">暂无日志。</pre>
      </section>
    </aside>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <script src="/static/app.js?v=maplibre3"></script>
</body>
</html>
